image: docker:19.03.12

variables:
  ENVIRONMENT: $CI_COMMIT_BRANCH


before_script:
  - cd ${CI_PROJECT_DIR}


stages:
  - build
  - deploy

.definitions:
  script: &script
    - apt-get update -qq
    # Setup SSH deploy keys
    - which ssh-agent || ( apt-get install -qq openssh-client )
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ${PRIVATE_SSH_KEY}
    - ssh-add ${PRIVATE_SSH_KEY}
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    - scp -P ${SSH_PORT} ${ENV_FILE} ${SSH_USER}@${SSH_HOST}:~/.env
    - scp -P ${SSH_PORT} docker-compose.yml ${SSH_USER}@${SSH_HOST}:~/docker-compose.yml
    - ssh -p ${SSH_PORT} ${SSH_USER}@${SSH_HOST} "docker login -u ${DOCKER_REGISTRY_USER} -p ${DOCKER_REGISTRY_PASSWORD} ${DOCKER_REGISTRY_HOST}:5000"
    - ssh -p ${SSH_PORT} ${SSH_USER}@${SSH_HOST} "docker pull $DOCKER_REGISTRY_HOST:5000/$DOCKER_IMAGE_NAME:$CI_COMMIT_BRANCH"
    - ssh -p ${SSH_PORT} ${SSH_USER}@${SSH_HOST} "docker tag $DOCKER_REGISTRY_HOST:5000/$DOCKER_IMAGE_NAME:$CI_COMMIT_BRANCH $DOCKER_IMAGE_NAME"
    - ssh -p ${SSH_PORT} ${SSH_USER}@${SSH_HOST} "${DOCKER_COMPOSE_COMMAND} down && ${DOCKER_COMPOSE_COMMAND} up -d"


build:
  image: docker:19.03.12
  stage: build
  only:
    - staging
    - production
  script:
    - cd ${CI_PROJECT_DIR}
    - echo "${DOCKER_REGISTRY_USER} -p ${DOCKER_REGISTRY_PASSWORD} ${DOCKER_REGISTRY_HOST}:5000"
    - echo ${DOCKER_REGISTRY_PASSWORD} | docker login --username ${DOCKER_REGISTRY_USER} --password-stdin ${DOCKER_REGISTRY_HOST}:5000
    - docker build -f Dockerfile -t ${DOCKER_REGISTRY_HOST}:5000/${DOCKER_IMAGE_NAME}:${CI_COMMIT_BRANCH} .
    - docker push ${DOCKER_REGISTRY_HOST}:5000/${DOCKER_IMAGE_NAME}:${CI_COMMIT_BRANCH}


deploy-staging:
  image: php:8.2.27-cli-bookworm
  stage: deploy
  environment:
    name: staging
  only:
    - staging
  tags:
    - home
  script: *script


deploy-production:
  image: php:8.2.27-cli-bookworm
  stage: deploy
  environment:
    name: production
  only:
    - production
  tags:
    - hetzner1
  script: *script
  when: manual
